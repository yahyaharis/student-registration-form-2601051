<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="form-container">
        <h1>Student Registration Form</h1>
        <p class="intro">Please complete the form below to register as a student.</p>

        <form action="#" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full_name" placeholder="Enter your full name" required autocomplete="name">
            </div>

            <div class="form-group">
                <label for="father-name">Father's Name</label>
                <input type="text" id="father-name" name="father_name" placeholder="Enter your father's name" required>
            </div>

            <div class="form-group">
                <label for="registration-number">Registration Number</label>
                <input type="text" id="registration-number" name="registration_number" placeholder="e.g., FA26-BSCS-001" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" minlength="8" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm_password" placeholder="Enter your password again" minlength="8" required autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="date_of_birth" required>
            </div>

            <fieldset class="form-group gender-group">
                <legend>Gender</legend>
                <div class="radio-options">
                    <label><input type="radio" name="gender" value="male" required> Male</label>
                    <label><input type="radio" name="gender" value="female"> Female</label>
                    <label><input type="radio" name="gender" value="other"> Other</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="department">Department</label>
                <select id="department" name="department" required>
                    <option value="" disabled selected>Select your department</option>
                    <option value="BSSE">BSSE</option>
                    <option value="BSAI">BSAI</option>
                    <option value="BSDS">BSDS</option>
                    <option value="BSCS">BSCS</option>
                </select>
            </div>

            <div class="form-group">
                <label for="semester">Semester</label>
                <select id="semester" name="semester" required>
                    <option value="" disabled selected>Select your semester</option>
                    <option value="1">1st Semester</option>
                    <option value="2">2nd Semester</option>
                    <option value="3">3rd Semester</option>
                    <option value="4">4th Semester</option>
                    <option value="5">5th Semester</option>
                    <option value="6">6th Semester</option>
                    <option value="7">7th Semester</option>
                    <option value="8">8th Semester</option>
                </select>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="e.g., 03XX-XXXXXXX" required autocomplete="tel">
            </div>

            <div class="form-group">
                <label for="address">Permanent Address</label>
                <textarea id="address" name="permanent_address" rows="3" placeholder="Enter your complete permanent address" required autocomplete="street-address"></textarea>
            </div>

            <div class="form-group">
                <label for="profile-picture">Profile Picture</label>
                <input type="file" id="profile-picture" name="profile_picture" accept="image/*" required>
                <small>Please select an image file.</small>
            </div>

            <div class="terms-group">
                <label for="terms"><input type="checkbox" id="terms" name="terms" required> I agree to the Terms and Conditions.</label>
            </div>

            <div class="button-group">
                <button type="submit" class="btn register-btn">Register</button>
                <button type="reset" class="btn reset-btn">Reset</button>
            </div>
        </form>
    </main>
</body>
</html>
